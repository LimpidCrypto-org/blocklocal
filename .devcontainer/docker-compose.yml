version: "3"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    networks:
      - blocklocal
    env_file:
      - .env
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: $DATABASE_USER
      POSTGRES_PASSWORD: $DATABASE_PASSWORD
      POSTGRES_DB: $DATABASE_NAME
    ports:
      - $DATABASE_PORT:5432
    restart: unless-stopped
    networks:
      - blocklocal
  # Database adminer
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 8080:8080
    networks:
      - blocklocal
    environment:
      - ADMINER_DESIGN=dracula
      - ADMINER_DEFAULT_SERVER=db

networks:
  blocklocal:
    driver: bridge