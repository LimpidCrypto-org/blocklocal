[package]
name = "blocklocal"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.41"
compose-rs = { version = "0.0.3", optional = true }
diesel = { version = "2.2.11", features = ["postgres", "chrono", "uuid"] }
dotenvy = "0.15.7"
rand = "0.9.1"
reqwest = "0.12.22"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = { version = "2.0.12" }
tokio = { version = "1.46.1", features = ["full"] }
url = "2.5.4"
uuid = "1.17.0"
zip = "4.2.0"

[features]
default = ["compose-rs"]
docker-compose = ["compose-rs"]
